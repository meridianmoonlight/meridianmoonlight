<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="1020" height="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8D97C2"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB454"/>
    </marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6FC3E8"/>
    </marker>
    <linearGradient id="nightband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A2149" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#1A2149" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A2149" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="600" fill="#0A0E20"/>

  <text x="40" y="44" fill="#FFB454" font-size="11.5" letter-spacing="3">MERIDIAN MOONLIGHT — REQUEST FLOW</text>
  <text x="40" y="72" fill="#EAEDFA" font-size="21" font-weight="700">One prompt, three phones, one verified answer</text>

  <!-- ROW 1 -->
  <rect x="40" y="112" width="180" height="104" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="58" y="139" fill="#6FC3E8" font-size="10" letter-spacing="2">1 · ASKS</text>
  <text x="58" y="166" fill="#EAEDFA" font-size="15" font-weight="600">Anyone</text>
  <text x="58" y="188" fill="#8D97C2" font-size="11.5">No account.</text>
  <text x="58" y="206" fill="#8D97C2" font-size="11.5">No payment.</text>

  <line x1="222" y1="164" x2="296" y2="164" stroke="#8D97C2" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="230" y="153" fill="#8D97C2" font-size="10">encrypted</text>

  <rect x="298" y="112" width="200" height="104" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="316" y="139" fill="#6FC3E8" font-size="10" letter-spacing="2">2 · ROUTES</text>
  <text x="316" y="166" fill="#EAEDFA" font-size="15" font-weight="600">Coordinator</text>
  <text x="316" y="188" fill="#8D97C2" font-size="11.5">Picks night-side nodes.</text>
  <text x="316" y="206" fill="#8D97C2" font-size="11.5">Never sees content.</text>

  <line x1="500" y1="164" x2="576" y2="164" stroke="#FFB454" stroke-width="1.5" marker-end="url(#arwA)"/>
  <text x="506" y="153" fill="#FFB454" font-size="10">same job &#215;3</text>

  <rect x="578" y="94" width="402" height="182" rx="3" fill="url(#nightband)"/>
  <text x="596" y="116" fill="#8D97C2" font-size="9.5" letter-spacing="2">NIGHT-SIDE FLEET &#183; CHARGING &#183; WI-FI &#183; IDLE</text>

  <rect x="596" y="130" width="112" height="74" rx="3" fill="#0A0E20" stroke="#FFB454" stroke-opacity="0.5"/>
  <circle cx="614" cy="152" r="4" fill="#FFB454"/>
  <text x="628" y="156" fill="#EAEDFA" font-size="12.5" font-weight="600">Phone A</text>
  <text x="612" y="178" fill="#8D97C2" font-size="10.5">whole model,</text>
  <text x="612" y="194" fill="#8D97C2" font-size="10.5">run locally</text>

  <rect x="722" y="130" width="112" height="74" rx="3" fill="#0A0E20" stroke="#FFB454" stroke-opacity="0.5"/>
  <circle cx="740" cy="152" r="4" fill="#FFB454"/>
  <text x="754" y="156" fill="#EAEDFA" font-size="12.5" font-weight="600">Phone B</text>
  <text x="738" y="178" fill="#8D97C2" font-size="10.5">whole model,</text>
  <text x="738" y="194" fill="#8D97C2" font-size="10.5">run locally</text>

  <rect x="848" y="130" width="112" height="74" rx="3" fill="#0A0E20" stroke="#FFB454" stroke-opacity="0.5"/>
  <circle cx="866" cy="152" r="4" fill="#FFB454"/>
  <text x="880" y="156" fill="#EAEDFA" font-size="12.5" font-weight="600">Phone C</text>
  <text x="864" y="178" fill="#8D97C2" font-size="10.5">whole model,</text>
  <text x="864" y="194" fill="#8D97C2" font-size="10.5">run locally</text>

  <text x="596" y="230" fill="#EAEDFA" font-size="11" font-weight="700" letter-spacing="1">3 &#183; COMPUTE</text>
  <text x="596" y="250" fill="#8D97C2" font-size="11">No model is ever split across the internet, so there are</text>
  <text x="596" y="266" fill="#8D97C2" font-size="11">no per-token network hops. Nodes keep nothing.</text>

  <!-- down to verification -->
  <line x1="779" y1="278" x2="779" y2="322" stroke="#8D97C2" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ROW 2 -->
  <rect x="578" y="324" width="402" height="112" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="596" y="351" fill="#6FC3E8" font-size="10" letter-spacing="2">4 &#183; VERIFIES</text>
  <text x="596" y="378" fill="#EAEDFA" font-size="15" font-weight="600">Results compared</text>
  <text x="596" y="400" fill="#8D97C2" font-size="11.5">Output is not bit-identical across different hardware, so</text>
  <text x="596" y="418" fill="#8D97C2" font-size="11.5">canaries and re-derivation audits carry the check.</text>

  <!-- verification -> coordinator (below both rows) -->
  <path d="M578 380 L398 380 L398 230" fill="none" stroke="#8D97C2" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="410" y="374" fill="#8D97C2" font-size="10">agreed answer</text>

  <!-- coordinator -> requester, routed below -->
  <path d="M348 218 L348 268 L130 268 L130 222" fill="none" stroke="#6FC3E8" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="150" y="290" fill="#6FC3E8" font-size="11" font-weight="700" letter-spacing="1">5 &#183; ANSWERS</text>
  <text x="150" y="310" fill="#8D97C2" font-size="11">Returned to the asker. The node</text>
  <text x="150" y="326" fill="#8D97C2" font-size="11">never learns who it served, and</text>
  <text x="150" y="342" fill="#8D97C2" font-size="11">the asker never learns which</text>
  <text x="150" y="358" fill="#8D97C2" font-size="11">device answered.</text>

  <!-- footnote -->
  <line x1="40" y1="500" x2="980" y2="500" stroke="#2A3468"/>
  <text x="40" y="526" fill="#EAEDFA" font-size="11.5" font-weight="600">A job is a prompt plus a model ID — never a script, a binary, or a container.</text>
  <text x="40" y="548" fill="#8D97C2" font-size="11.5">The network cannot execute arbitrary code on a volunteer's phone. That constraint is the</text>
  <text x="40" y="566" fill="#8D97C2" font-size="11.5">foundation of the security model, not a feature that can be relaxed later.</text>
</svg>
