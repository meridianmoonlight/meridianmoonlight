<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1020" height="660" fill="#0A0E20"/>

  <text x="40" y="44" fill="#FFB454" font-size="11.5" letter-spacing="3">MERIDIAN MOONLIGHT — WHAT IT CAN DO</text>
  <text x="40" y="72" fill="#EAEDFA" font-size="21" font-weight="700">Two products from the same idle machine.</text>
  <text x="40" y="96" fill="#8D97C2" font-size="12.5">Every number below is generated by analysis/compute_model.py and analysis/model_ladder.py. Modelled, not measured.</text>

  <!-- ================= LEFT: FREE AI ================= -->
  <rect x="40" y="124" width="450" height="330" rx="3" fill="#111735" stroke="#FFB454" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="64" y="152" fill="#FFB454" font-size="10" letter-spacing="2">PRODUCT ONE — FOR PEOPLE</text>
  <text x="64" y="180" fill="#EAEDFA" font-size="17" font-weight="700">Free AI that is actually good</text>
  <text x="64" y="204" fill="#8D97C2" font-size="11.5">No account. No rate limit. No retention. No price.</text>

  <text x="64" y="238" fill="#6FC3E8" font-size="9.5" letter-spacing="1.6">THE MODEL LADDER — WHAT A MACHINE CAN HOST</text>

  <!-- ladder rows -->
  <rect x="64" y="250" width="402" height="26" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="78" y="268" fill="#8D97C2" font-size="11">Phone</text>
  <text x="196" y="268" fill="#8D97C2" font-size="11">3B model</text>
  <text x="316" y="268" fill="#8D97C2" font-size="11">useful, not impressive</text>

  <rect x="64" y="280" width="402" height="26" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="78" y="298" fill="#EAEDFA" font-size="11">Most PCs</text>
  <text x="196" y="298" fill="#EAEDFA" font-size="11">8B model</text>
  <text x="316" y="298" fill="#8D97C2" font-size="11">a clear step up</text>

  <rect x="64" y="310" width="402" height="26" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="78" y="328" fill="#EAEDFA" font-size="11">12GB card</text>
  <text x="196" y="328" fill="#EAEDFA" font-size="11">14B model</text>
  <text x="316" y="328" fill="#8D97C2" font-size="11">genuinely capable</text>

  <rect x="64" y="340" width="402" height="30" rx="2" fill="#1A2149" stroke="#FFB454" stroke-opacity="0.7"/>
  <text x="78" y="360" fill="#FFB454" font-size="11.5" font-weight="600">24GB card</text>
  <text x="196" y="360" fill="#FFB454" font-size="11.5" font-weight="600">32B model</text>
  <text x="316" y="360" fill="#FFB454" font-size="11.5" font-weight="600">the tier people pay for</text>

  <line x1="64" y1="388" x2="466" y2="388" stroke="#2A3468"/>
  <text x="64" y="412" fill="#EAEDFA" font-size="13" font-weight="600">331,000 enthusiast PCs</text>
  <text x="64" y="430" fill="#8D97C2" font-size="11.5">would serve 100,000 people at once, on the 32B tier.</text>
  <text x="64" y="446" fill="#8D97C2" font-size="11.5">That is 1.1% of the machines already able to run it.</text>

  <!-- ================= RIGHT: SCIENCE ================= -->
  <rect x="530" y="124" width="450" height="330" rx="3" fill="#111735" stroke="#3FD0C9" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="554" y="152" fill="#3FD0C9" font-size="10" letter-spacing="2">PRODUCT TWO — FOR RESEARCH</text>
  <text x="554" y="180" fill="#EAEDFA" font-size="17" font-weight="700">A research instrument owned by nobody</text>
  <text x="554" y="204" fill="#8D97C2" font-size="11.5">Overnight batch work, free to scientists who cannot pay.</text>

  <text x="554" y="238" fill="#6FC3E8" font-size="9.5" letter-spacing="1.6">SCALE, AGAINST THE LARGEST VOLUNTEER EFFORT IN HISTORY</text>

  <!-- science scale, as figures rather than bars: the range is 224x and no
       honest bar chart survives that on a linear axis -->
  <rect x="554" y="250" width="402" height="26" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="568" y="268" fill="#8D97C2" font-size="11">Folding@home, peak</text>
  <text x="726" y="268" fill="#8D97C2" font-size="11">2.4 exaFLOPS</text>
  <text x="856" y="268" fill="#8D97C2" font-size="11">the benchmark</text>

  <rect x="554" y="280" width="402" height="26" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="568" y="298" fill="#EAEDFA" font-size="11">1.3M gaming PCs</text>
  <text x="726" y="298" fill="#EAEDFA" font-size="11">2.4 exaFLOPS</text>
  <text x="856" y="298" fill="#8D97C2" font-size="11">matches it</text>

  <rect x="554" y="310" width="402" height="30" rx="2" fill="#1A2149" stroke="#3FD0C9" stroke-opacity="0.7"/>
  <text x="568" y="330" fill="#3FD0C9" font-size="11.5" font-weight="600">Every capable PC</text>
  <text x="726" y="330" fill="#3FD0C9" font-size="11.5" font-weight="600">538 exaFLOPS</text>
  <text x="856" y="330" fill="#3FD0C9" font-size="11.5" font-weight="600">224&#215;</text>

  <text x="554" y="366" fill="#8D97C2" font-size="11">Phones reach the same parity at 31 million devices —</text>
  <text x="554" y="382" fill="#8D97C2" font-size="11">24 times more machines for the same science.</text>

  <line x1="554" y1="404" x2="956" y2="404" stroke="#2A3468"/>
  <text x="554" y="428" fill="#8D97C2" font-size="11.5">Drug screening against neglected diseases. Protein</text>
  <text x="554" y="444" fill="#8D97C2" font-size="11.5">dynamics. Materials search. Climate ensembles.</text>

  <!-- ================= BOTTOM: THE HONEST BAR ================= -->
  <rect x="40" y="476" width="940" height="70" rx="3" fill="#111735" stroke="#6FC3E8" stroke-opacity="0.5"/>
  <text x="64" y="502" fill="#6FC3E8" font-size="10" letter-spacing="2">WHAT IT CANNOT DO — STATED UP FRONT</text>
  <text x="64" y="524" fill="#EAEDFA" font-size="11.5">It will never out-compute a data centre in raw operations. It will never train a frontier model.</text>
  <text x="64" y="540" fill="#8D97C2" font-size="11.5">It runs millions of independent tasks, not one enormous one — and it only ever runs work we have already built and audited.</text>

  <!-- ================= FOOTER: THE ASK ================= -->
  <text x="40" y="588" fill="#FFB454" font-size="10" letter-spacing="2">WHAT WOULD MAKE IT REAL</text>
  <rect x="40" y="600" width="298" height="40" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="56" y="619" fill="#EAEDFA" font-size="11.5" font-weight="600">A PC left on overnight</text>
  <text x="56" y="634" fill="#8D97C2" font-size="10.5">idle, powered, and doing nothing else</text>

  <rect x="354" y="600" width="298" height="40" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="370" y="619" fill="#EAEDFA" font-size="11.5" font-weight="600">Someone who finds our errors</text>
  <text x="370" y="634" fill="#8D97C2" font-size="10.5">the math is public and we have been wrong twice</text>

  <rect x="668" y="600" width="312" height="40" rx="2" fill="#0A0E20" stroke="#2A3468"/>
  <text x="684" y="619" fill="#EAEDFA" font-size="11.5" font-weight="600">A researcher with no budget</text>
  <text x="684" y="634" fill="#8D97C2" font-size="10.5">and an embarrassingly parallel problem</text>
</svg>
