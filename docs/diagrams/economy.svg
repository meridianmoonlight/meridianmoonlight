<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="e-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB454"/>
    </marker>
    <marker id="e-arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6FC3E8"/>
    </marker>
  </defs>

  <rect width="1020" height="700" fill="#0A0E20"/>

  <text x="40" y="44" fill="#FFB454" font-size="11.5" letter-spacing="3">MERIDIAN MOONLIGHT — THE COMPUTE ECONOMY</text>
  <text x="40" y="72" fill="#EAEDFA" font-size="21" font-weight="700">Earn compute by giving compute. No money crosses here.</text>
  <text x="40" y="96" fill="#8D97C2" font-size="12.5">Two ledgers that never touch. Contributors earn an allowance; institutions and companies pay ordinary money into a public account.</text>

  <!-- ============ CONTRIBUTOR LOOP ============ -->
  <rect x="40" y="124" width="292" height="140" rx="3" fill="#111735" stroke="#FFB454" stroke-opacity="0.5"/>
  <text x="62" y="150" fill="#FFB454" font-size="10" letter-spacing="2">CONTRIBUTE</text>
  <text x="62" y="176" fill="#EAEDFA" font-size="14.5" font-weight="600">Hours, not horsepower</text>
  <text x="62" y="200" fill="#8D97C2" font-size="11">Credits accrue for reliable overnight</text>
  <text x="62" y="216" fill="#8D97C2" font-size="11">availability. A four-year-old phone earns</text>
  <text x="62" y="232" fill="#8D97C2" font-size="11">what a 24GB graphics card earns.</text>
  <text x="62" y="252" fill="#6FC3E8" font-size="11">Deliberately. See the note below.</text>

  <rect x="364" y="124" width="292" height="140" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="386" y="150" fill="#FFB454" font-size="10" letter-spacing="2">CREDITS</text>
  <text x="386" y="176" fill="#EAEDFA" font-size="14.5" font-weight="600">A usage allowance</text>
  <text x="386" y="200" fill="#8D97C2" font-size="11">Verified work only — a machine that</text>
  <text x="386" y="216" fill="#8D97C2" font-size="11">fails a hidden check earns nothing.</text>
  <text x="386" y="232" fill="#8D97C2" font-size="11">Capped per machine per day. Decays,</text>
  <text x="386" y="248" fill="#8D97C2" font-size="11">so it never becomes savings.</text>

  <rect x="688" y="124" width="292" height="140" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="710" y="150" fill="#FFB454" font-size="10" letter-spacing="2">SPEND</text>
  <text x="710" y="176" fill="#EAEDFA" font-size="14.5" font-weight="600">Priority and headroom</text>
  <text x="710" y="200" fill="#8D97C2" font-size="11">Queue priority, longer context, and</text>
  <text x="710" y="216" fill="#8D97C2" font-size="11">access to the bigger models only PCs</text>
  <text x="710" y="232" fill="#8D97C2" font-size="11">can host — plus the right to submit your</text>
  <text x="710" y="248" fill="#8D97C2" font-size="11">own batch job against an audited task.</text>

  <path d="M332 194 L358 194" stroke="#FFB454" stroke-width="1.6" fill="none" marker-end="url(#e-arw)"/>
  <path d="M656 194 L682 194" stroke="#FFB454" stroke-width="1.6" fill="none" marker-end="url(#e-arw)"/>
  <path d="M834 264 L834 288 L200 288 L200 268" stroke="#FFB454" stroke-width="1.2" fill="none" marker-end="url(#e-arw)" stroke-opacity="0.65"/>
  <text x="446" y="284" fill="#8D97C2" font-size="10.5">the loop closes — spending returns capacity to the pool</text>

  <!-- ============ THE TENSION, RESOLVED ============ -->
  <rect x="40" y="308" width="940" height="88" rx="3" fill="#111735" stroke="#6FC3E8" stroke-opacity="0.6"/>
  <text x="62" y="332" fill="#6FC3E8" font-size="10" letter-spacing="2">THE OBVIOUS OBJECTION — AND WHY THE ANSWER IS NOT MORE CREDITS</text>
  <text x="62" y="356" fill="#EAEDFA" font-size="12.5">If a 24GB card earns no more than an old phone, why contribute the expensive machine?</text>
  <text x="62" y="378" fill="#8D97C2" font-size="11.5">Because paying by speed would hand the most free AI to whoever already owns the best hardware — a quiet betrayal of the point. Recognition</text>
  <text x="62" y="392" fill="#8D97C2" font-size="11.5">is weighted by what you contribute. Allocation never is. And the flagship model your card hosts is one you get to use, along with everyone else.</text>

  <!-- ============ THE FLOOR ============ -->
  <rect x="40" y="412" width="940" height="72" rx="3" fill="#111735" stroke="#6FC3E8"/>
  <text x="62" y="436" fill="#6FC3E8" font-size="10" letter-spacing="2">THE FLOOR — UNCONDITIONAL</text>
  <text x="62" y="460" fill="#EAEDFA" font-size="15" font-weight="600">Free access for everyone, at zero balance, forever</text>
  <text x="62" y="478" fill="#8D97C2" font-size="11.5">Credits buy priority and headroom — never access. If the free tier ever degrades to make credits attractive, the project has failed.</text>

  <!-- ============ SEPARATE LEDGER ============ -->
  <line x1="40" y1="514" x2="980" y2="514" stroke="#2A3468" stroke-dasharray="4 4"/>
  <text x="40" y="540" fill="#6FC3E8" font-size="10" letter-spacing="2">SEPARATE LEDGER — WHERE ACTUAL MONEY LIVES</text>

  <rect x="40" y="552" width="440" height="126" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="62" y="576" fill="#6FC3E8" font-size="10" letter-spacing="2">IN</text>
  <text x="62" y="600" fill="#EAEDFA" font-size="14" font-weight="600">Institutions and companies buy batch time</text>
  <text x="62" y="622" fill="#8D97C2" font-size="11">Research bodies and corporations pay ordinary currency</text>
  <text x="62" y="638" fill="#8D97C2" font-size="11">for scheduled overnight capacity, drawn only from surplus</text>
  <text x="62" y="654" fill="#8D97C2" font-size="11">and never displacing free access. Every buyer is named.</text>
  <text x="62" y="670" fill="#8D97C2" font-size="11">No single buyer may exceed 25% of revenue.</text>

  <rect x="540" y="552" width="440" height="126" rx="3" fill="#111735" stroke="#2A3468"/>
  <text x="562" y="576" fill="#6FC3E8" font-size="10" letter-spacing="2">OUT</text>
  <text x="562" y="600" fill="#EAEDFA" font-size="14" font-weight="600">Hosting, audits, and research grants</text>
  <text x="562" y="622" fill="#8D97C2" font-size="11">Posted on a public ledger, permanently. Commercial buyers</text>
  <text x="562" y="638" fill="#8D97C2" font-size="11">subsidise a grant pool for scientists who cannot pay.</text>
  <text x="562" y="654" fill="#8D97C2" font-size="11">Paying buys compute and nothing else — no priority, no</text>
  <text x="562" y="670" fill="#8D97C2" font-size="11">roadmap influence. Contributors are never paid.</text>

  <path d="M480 612 L534 612" stroke="#6FC3E8" stroke-width="1.5" fill="none" marker-end="url(#e-arwc)"/>
</svg>
